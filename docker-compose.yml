  #   env_file: .env.docker

  worker-redwood:
    profiles:
      - redwood-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: always
    volumes:
      - payload-public:/app/public
      # The Next.js dev server runs on the host and writes private uploads here.
      # Share that directory so background jobs can read newly uploaded files.
      - ./private-media:/app/private-media
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URI=${DOCKER_DATABASE_URI:-mongodb://mongo:27017/cvx-junior-golf?replicaSet=rs0&directConnection=true}
      - TZ=America/Detroit
    env_file: .env

  # Payments require transactions. Keep the single-node replica set for local use.
  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
      - --replSet=rs0
      - --bind_ip_all
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-replica-healthcheck.js:/usr/local/bin/mongo-replica-healthcheck.js:ro
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--file', '/usr/local/bin/mongo-replica-healthcheck.js']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - app-network

volumes:
  mongo-data:
  payload-public:

networks:
  app-network:
    driver: bridge
