<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Proposed guided collection</title><desc id="desc">Shared client and payment preparation splits into instant report processing or lab collection. Dashed arrows show recovery and exceptions. The full decision table is in README.md.</desc>
