name: drug-test-mi-payments

services:
  mongo-payments:
    # MongoDB 8.0.10, pinned to the verified image already available locally.
    image: mongo@sha256:98028cf281bb5d49ace5e1ddbd4509e8f1382fe80ef1cf101eeefdc106d76cd4
    command: ['mongod', '--replSet', 'drug-test-mi-payments', '--bind_ip_all']
    ports:
      - '127.0.0.1:28017:27017'
    volumes:
      - payments-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            if (error.code !== 94) throw error;
            rs.initiate({ _id: 'drug-test-mi-payments', members: [{ _id: 0, host: 'mongo-payments:27017' }] });
          }
          if (!db.hello().isWritablePrimary) quit(1);
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  payments-mongo-data:
