services:
  web:
    image: mikecebul/drug-test-mi:branch-test
    pull_policy: always
    restart: always
    ports:
      - 3000
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Branch-test is the Redwood integration environment. Do not allow a
      # stale .env value to silently disable automation after a redeploy.
      REDWOOD_AUTOMATION_ENABLED: 'true'
      REDWOOD_USERNAME: '${REDWOOD_USERNAME:?REDWOOD_USERNAME must be configured in Dokploy}'
      REDWOOD_PASSWORD: '${REDWOOD_PASSWORD:?REDWOOD_PASSWORD must be configured in Dokploy}'
      REDWOOD_ACCOUNT_NUMBER: '310974'
      REDWOOD_ALLOWED_ACCOUNT_NUMBERS: '310974'
    networks:
      - dokploy-network

  worker-redwood:
    image: mikecebul/drug-test-mi:branch-test-worker
    pull_policy: always
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDWOOD_AUTOMATION_ENABLED: 'true'
      REDWOOD_USERNAME: '${REDWOOD_USERNAME:?REDWOOD_USERNAME must be configured in Dokploy}'
      REDWOOD_PASSWORD: '${REDWOOD_PASSWORD:?REDWOOD_PASSWORD must be configured in Dokploy}'
      REDWOOD_ACCOUNT_NUMBER: '310974'
      REDWOOD_ALLOWED_ACCOUNT_NUMBERS: '310974'
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
