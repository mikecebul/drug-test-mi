name: Worker Image Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: worker-image-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  worker-image:
    name: worker-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          platforms: linux/amd64
          load: true
          push: false
          tags: drug-test-mi-worker:ci
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,mode=max,scope=worker-image

      - name: Verify worker runtime and report size
        run: |
          docker run --rm --entrypoint node drug-test-mi-worker:ci -e "require.resolve('payload')"
          docker run --rm --entrypoint sh drug-test-mi-worker:ci -c 'test -x /app/node_modules/.bin/payload'
          docker image inspect drug-test-mi-worker:ci --format 'worker-image-bytes={{.Size}}'
