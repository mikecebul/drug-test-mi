name: Build and deploy production images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-docker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push-dockerfile-image-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            mikecebul/drug-test-mi:latest
            mikecebul/drug-test-mi:main-${{ github.sha }}
          platforms: linux/amd64
          secrets: |
            DATABASE_URI=${{ secrets.DATABASE_URI }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_IS_LIVE=${{ secrets.NEXT_PUBLIC_IS_LIVE }}
            NEXT_PUBLIC_S3_HOSTNAME=${{ secrets.NEXT_PUBLIC_S3_HOSTNAME }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_UPLOAD_PREFIX=${{ secrets.NEXT_PUBLIC_UPLOAD_PREFIX }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build and push Redwood worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          tags: |
            mikecebul/drug-test-mi:latest-worker
            mikecebul/drug-test-mi:main-${{ github.sha }}-worker
          platforms: linux/amd64

      - name: Deploy production Compose in Dokploy
        env:
          DOKPLOY_COMPOSE_DEPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_COMPOSE_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_COMPOSE_DEPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_COMPOSE_DEPLOY_WEBHOOK_URL is not configured in the production environment."
            exit 1
          fi

          response="$(curl --fail --show-error --silent \
            --connect-timeout 15 \
            --max-time 30 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: ${GITHUB_EVENT_NAME}" \
            --data-binary "@${GITHUB_EVENT_PATH}" \
            "$DOKPLOY_COMPOSE_DEPLOY_WEBHOOK_URL")"

          echo "$response"
          if [[ "$response" != *'"message":"Compose deployed successfully"'* ]]; then
            echo "Dokploy did not accept the production Compose deployment request."
            exit 1
          fi
